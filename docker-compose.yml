# Local development only. Free/open-source stack: Postgres + the Spring Boot API.
# Run:  docker compose up --build
# API:  http://localhost:8080
# Swagger: http://localhost:8080/swagger-ui.html
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keystone
      POSTGRES_USER: keystone
      POSTGRES_PASSWORD: keystone
    ports:
      - "5432:5432"
    volumes:
      - keystone_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keystone"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/keystone
      DATABASE_USERNAME: keystone
      DATABASE_PASSWORD: keystone
      JWT_SECRET: dev-only-secret-change-in-production-32chars-min
      ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

volumes:
  keystone_pgdata:
